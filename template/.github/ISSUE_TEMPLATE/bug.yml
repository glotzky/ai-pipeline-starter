name: Bug
description: Report a defect. The pipeline writes a failing test first, then fixes it.
title: "[bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, plus the page, input or data involved.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Screenshots, error text, how often it happens.
